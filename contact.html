<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact - Free Online Tools</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(-45deg,#0f172a,#312e81,#1d4ed8,#581c87);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
    color:white;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.box{
    width:92%;
    max-width:650px;
    padding:30px;
    border-radius:22px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    box-shadow:0 20px 50px rgba(0,0,0,.3);
    animation:show .8s ease;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    text-align:center;
    margin-top:0;
}

p{
    line-height:1.6;
    color:#e5e7eb;
}

input,textarea{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:0;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

textarea{
    height:130px;
    resize:vertical;
}

button{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:0;
    border-radius:10px;
    background:white;
    color:#312e81;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.02);
}

.back{
    background:transparent;
    color:white;
    border:1px solid rgba(255,255,255,.5);
}
</style>
</head>

<body>

<div class="box">

<h1>📞 Contact Us</h1>

<p>
Have a question, suggestion, or found a problem with one of our
tools? You can contact us using the form below.
</p>

<form onsubmit="sendMessage(event)">

<input
    type="text"
    id="name"
    placeholder="Your Name"
    required
>

<input
    type="email"
    id="email"
    placeholder="Your Email"
    required
>

<textarea
    id="message"
    placeholder="Write your message..."
    required
></textarea>

<button type="submit">
📨 Send Message
</button>

</form>

<button class="back" onclick="location.href='index.html'">
🏠 Back to Home
</button>

</div>

<script>

function sendMessage(event){

    event.preventDefault();

    alert(
        "Thank you for your message! " +
        "Please use your email app to contact the website owner."
    );

}

</script>

</body>
</html>
